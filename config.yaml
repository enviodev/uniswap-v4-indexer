# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: uniswap-v4-indexer
disable_default_cross_chain: true
storage:
  postgres: true
contracts:
  - name: PoolManager
    events:
      - event: Approval(address indexed owner, address indexed spender, uint256 indexed id, uint256 amount)
      - event: Donate(bytes32 indexed id, address indexed sender, uint256 amount0, uint256 amount1)
      - event: Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing, address hooks, uint160 sqrtPriceX96, int24 tick)
      - event: ModifyLiquidity(bytes32 indexed id, address indexed sender, int24 tickLower, int24 tickUpper, int256 liquidityDelta, bytes32 salt)
        field_selection: # Additional fields available to index to augment data
          transaction_fields:
            - "hash"
            - "from"
            # Gas for the position's totalGasCostETH and per-transaction rows.
            # l1Fee is the OP-stack data fee: Ponder cannot capture it (its
            # receipt has no such field, documented there as unfixable), so this
            # is strictly more accurate. It is absent on non-OP chains, where it
            # comes back undefined and is treated as zero.
            - "gasUsed"
            - "effectiveGasPrice"
            - "l1Fee"
      - event: OperatorSet(address indexed owner, address indexed operator, bool approved)
      - event: OwnershipTransferred(address indexed user, address indexed newOwner)
      - event: ProtocolFeeControllerUpdated(address indexed protocolFeeController)
      - event: ProtocolFeeUpdated(bytes32 indexed id, uint24 protocolFee)
      - event: Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick, uint24 fee)
        field_selection: # Additional fields available to index to augment data
          transaction_fields:
            - "hash"
            - "from"
      - event: Transfer(address caller, address indexed from, address indexed to, uint256 indexed id, uint256 amount)
  - name: PositionManager
    events:
      - event: Subscription(uint256 indexed tokenId, address indexed subscriber)
        field_selection:
          transaction_fields:
            - "hash"
            - "from"
      - event: Transfer(address indexed from, address indexed to, uint256 indexed id)
        field_selection:
          transaction_fields:
            - "hash"
            - "from"
      - event: Unsubscription(uint256 indexed tokenId, address indexed subscriber)
        field_selection:
          transaction_fields:
            - "hash"
            - "from"
chains:
  # ─────────────────────────────────────────────────────────────────────────────
  # ONE config, many chains. Every UNCOMMENTED block below is indexed, and Envio
  # runs them all in parallel in a single process — so enabling a chain is
  # uncommenting its block, and disabling one is commenting it out again.
  #
  # This replaces the old per-chain config.ethereum.yaml / config.robinhood.yaml
  # files. Those existed only to run one chain at a time, and `scripts/dev.mjs`
  # derived a Postgres schema from the filename to keep their data apart. With a
  # single config there is one schema (`public`), which is what you want when the
  # point is to serve several chains from one endpoint.
  #
  # `start_block` is the v4 PoolManager DEPLOY block where it is known, taken from
  # the Ponder indexer's networks.json. Do not set it to 0 on a chain that has a
  # real deploy block: it costs a scan of every block before the contract existed,
  # and on a fast chain that is the difference between minutes and days.
  #
  # A chain with no deploy block recorded is left at 0 and marked below — set it
  # before enabling that chain for anything beyond a smoke test.
  # ─────────────────────────────────────────────────────────────────────────────
  # ── Ethereum (1)
  - id: 1
    start_block: 21688326
    contracts:
      - name: PositionManager
        address:
          - 0xbD216513d74C8cf14cf4747E6AaA6420FF64ee9e
      - name: PoolManager
        address:
